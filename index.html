<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Studio Spreza makes Kiwido and Upkeeper."
    />
    <meta name="theme-color" content="#f4f0e8" />
    <link rel="canonical" href="https://www.studiospreza.com/" />
    <meta property="og:title" content="Studio Spreza — Boutique App Studio" />
    <meta
      property="og:description"
      content="Studio Spreza makes Kiwido and Upkeeper."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.studiospreza.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Studio Spreza — Boutique App Studio" />
    <meta
      name="twitter:description"
      content="Studio Spreza makes Kiwido and Upkeeper."
    />
    <title>Studio Spreza</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1;
          transform: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="logo brand-wordmark" href="/">Studio Spreza</a>
      </div>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-atmosphere" aria-hidden="true">
          <div class="hero-glow"></div>
        </div>
        <div class="wrap hero-content">
          <header class="hero-header">
            <div class="hero-copy">
              <h1 id="hero-title" class="hero-title brand-wordmark">Studio Spreza</h1>
            </div>
          </header>
        </div>
      </section>

      <section id="work" class="section work" aria-labelledby="work-title">
        <div class="wrap">
          <header class="chapter-head chapter-head--row" data-reveal>
            <h2 id="work-title" class="chapter-title">Apps</h2>
          </header>

          <ul class="work-list">
            <li class="work-row" data-reveal>
              <div class="work-lede">
                <span class="work-icon" data-app="kiwido" aria-hidden="true"></span>
                <div class="work-row-body">
                  <h3 class="work-title">Kiwido</h3>
                  <p class="work-line">Tasks, events, weather. One week.</p>
                </div>
                <a class="app-store-link" href="#" aria-label="Kiwido on the App Store">
                  <picture>
                    <source srcset="assets/appstore-dark.svg" media="(prefers-color-scheme: dark)" />
                    <img src="assets/appstore-light.svg" width="120" height="40" alt="Download Kiwido on the App Store" />
                  </picture>
                </a>
              </div>
              <div class="work-gallery" role="region" aria-label="Kiwido screens" tabindex="0">
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/kiwido-h-scroll/kiwido-showcase-01.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Kiwido week board with weather, calendar context, and tasks for the selected day." />
                </span>
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/kiwido-h-scroll/kiwido-showcase-02.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Kiwido Next Up agenda showing upcoming events and reminders grouped by day." />
                </span>
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/kiwido-h-scroll/kiwido-showcase-03.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Kiwido add task sheet with date, list, priority, URL, and notes controls." />
                </span>
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/kiwido-h-scroll/kiwido-showcase-04.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Kiwido Activity screen showing Strawberry rank, total days, and streak progress." />
                </span>
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/kiwido-h-scroll/kiwido-showcase-05.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Kiwido Perfect Days screen showing yearly completion heatmaps and streak legend." />
                </span>
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/kiwido-h-scroll/kiwido-showcase-06.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Kiwido month planner showing dated week-board cards and calendar markers." />
                </span>
              </div>
            </li>
            <li class="work-row" data-reveal>
              <div class="work-lede">
                <span class="work-icon" data-app="upkeeper" aria-hidden="true"></span>
                <div class="work-row-body">
                  <h3 class="work-title">Upkeeper</h3>
                  <p class="work-line">Log it once. Know when it is due again.</p>
                </div>
                <a class="app-store-link" href="#" aria-label="Upkeeper on the App Store">
                  <picture>
                    <source srcset="assets/appstore-dark.svg" media="(prefers-color-scheme: dark)" />
                    <img src="assets/appstore-light.svg" width="120" height="40" alt="Download Upkeeper on the App Store" />
                  </picture>
                </a>
              </div>
              <div class="work-gallery" role="region" aria-label="Upkeeper screens" tabindex="0">
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/upkeeper-h-scroll/upkeeper-showcase-01.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Upkeeper Home showing due now, next, coming up, and learning upkeep actions." />
                </span>
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/upkeeper-h-scroll/upkeeper-showcase-02.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Upkeeper Add Action screen with name, rhythm, icon, reminders, and collection controls." />
                </span>
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/upkeeper-h-scroll/upkeeper-showcase-03.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Upkeeper Add Action sheet with an action name field and create action button." />
                </span>
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/upkeeper-h-scroll/upkeeper-showcase-04.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Upkeeper Status sheet showing needs-care actions, distribution, and next two weeks overview." />
                </span>
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/upkeeper-h-scroll/upkeeper-showcase-05.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Upkeeper Detail sheet showing last logged date, icon, rhythm, reminders, and log controls." />
                </span>
                <span class="work-shot">
                  <img class="work-shot-image" src="assets/upkeeper-h-scroll/upkeeper-showcase-06.png" width="1206" height="2622" loading="lazy" decoding="async" alt="Upkeeper onboarding screen with the first-one-in progress message." />
                </span>
              </div>
            </li>
          </ul>
        </div>
      </section>

      <section class="section studio-note" aria-label="Studio note">
        <div class="wrap" data-reveal>
          <p>Detail-oriented since day one.</p>
        </div>
      </section>

      <section id="contact" class="section contact" aria-label="Contact">
        <div class="wrap contact-layout" data-reveal>
          <a class="contact-email" href="mailto:hey@studiospreza.com">hey@studiospreza.com</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <span class="footer-brand">© 2026 Studio Spreza</span>
      </div>
    </footer>

    <script src="main.js" defer></script>
  </body>
</html>
