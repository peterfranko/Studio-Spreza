    <script>
      /* Applies a saved theme before first paint. Inline and synchronous on purpose:
         anything deferred lets the wrong scheme flash. Mirrored on every page so the
         choice carries across the site, including the policies, which load no main.js. */
      (function () {
        try {
          var saved = localStorage.getItem('spreza-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (error) {
          /* Private mode, or storage disabled: fall through to the system scheme. */
        }
      })();
    </script>
